services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leilao
      POSTGRES_PASSWORD: leilao_dev
      POSTGRES_DB: leilao_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leilao -d leilao_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
